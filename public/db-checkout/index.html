<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>고객DB 신청 | 픽견적 파트너</title><link rel="stylesheet" href="/db-checkout/checkout.css"><script defer src="/db-checkout/checkout.js"></script></head>
<body><header><a href="/" aria-label="판매자 페이지"><img src="/assets/pickquote-official-logo-navy.png" alt="픽견적"></a><span>파트너</span></header>
<main aria-busy="true"><h1>고객DB 신청</h1><p id="notice" role="status" aria-live="polite">이용 정보를 확인하고 있습니다.</p>
<section id="login" hidden><p>판매자 로그인 후 신청할 수 있습니다.</p><a class="primary" href="/">판매자 로그인</a></section>
<section id="checkout" hidden><form id="purchase"><div class="purchase-layout"><section><h2>신청 수량</h2><label for="quantity">고객DB 수량</label><div class="quantity"><button type="button" id="minus" aria-label="수량 줄이기">−</button><input id="quantity" type="number" min="1" max="100" step="1" value="1" required inputmode="numeric"><button type="button" id="plus" aria-label="수량 늘리기">+</button><span>건</span></div><p>1건당 8,000원</p><ul><li>결제 후 관리자가 고객을 배정합니다.</li><li>고객정보는 등록일부터 30일 후 삭제됩니다.</li></ul></section>
<aside><h2>결제 정보</h2><dl><div><dt>결제 수단</dt><dd>신용·체크카드</dd></div><div><dt>신청 수량</dt><dd id="summaryQuantity">1건</dd></div><div class="total"><dt>총 결제 금액</dt><dd><output id="total">8,000</output>원</dd></div></dl><label class="agree"><input id="agreed" type="checkbox" required><span>신청 수량과 이용 안내를 확인했습니다.</span></label><button class="primary" id="pay" type="submit" disabled>8,000원 카드결제</button><p class="payment-note">일회성 결제이며 자동 결제되지 않습니다.</p></aside></div></form></section>
<section id="result" hidden><h2 id="resultTitle">결제 확인</h2><p id="resultMessage"></p><button id="verify" type="button">결제 상태 다시 확인</button><a class="primary" href="/?tab=leads">고객DB 관리로</a></section>
<section id="history" hidden><h2>최근 결제 내역</h2><div id="orders"></div></section>
<footer><span>결제·미배정 건 취소 문의</span><a href="tel:07080980149">070-8098-0149</a><a href="/">판매자 페이지</a></footer></main></body></html>
